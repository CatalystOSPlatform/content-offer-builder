<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CatalystOS app header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Inter:wght@600;700&amp;family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://catalystos-dashboard-staging.vercel.app/catalyst-ui.css">
<script src="https://catalystos-dashboard-staging.vercel.app/cost-callout.js"></script>
<style>body{margin:0}@media (max-width: 560px) { .cob-picker { flex: 1 1 180px; min-width: 0 !important; } }</style>
</helmet>
<div style="font-family: 'Public Sans', sans-serif; color: #FFFFFF;">
<!-- Bars (Erika, Oct 20): top bar (account + agency right) · navy app bar (title left, client picker right) · light purple bar (Saved Files left). -->
<div class="cos-brandbar">
  <div class="cos-brandbar-l" style="display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-width:0;justify-self:start;"><div class="cos-brandbar-c"><span class="cos-mark">OS</span><span class="cos-powered">Powered by</span><span class="cos-wordmark">Catalyst<b>OS</b></span></div><span class="cos-agency-left" style="display:flex;align-items:center;padding-left:14px;border-left:1px solid rgba(255,255,255,0.18);min-width:0;"><span class="cos-agency"><span>Agency</span><strong>{{ agency }}</strong></span></span></div>
  <div class="cos-brandbar-c"></div>
  <div class="cos-brandbar-r">
    <span data-cos-cost="auto"></span>
    <div class="cos-user">
      <sc-if value="{{ hasEmail }}" hint-placeholder-val="{{ true }}"><span class="cos-user-email" title="{{ email }}">{{ email }}</span></sc-if>
      <button type="button" onClick="{{ onSignOut }}" class="cos-signout"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>Sign out</button>
    </div>
    <sc-if value="{{ hasAgency }}" hint-placeholder-val="{{ true }}"></sc-if>
  </div>
</div>
<div class="cos-appbar">
  <div class="cos-appbar-title"><span class="cos-appbar-app">{{ appName }}:</span><span class="cos-appbar-client">{{ clientName }}</span></div>
  <div class="cos-appbar-tools" role="group" aria-label="Client">
    <span class="cos-picker-label">Client:</span>
    <div class="cos-picker cob-picker" style="min-width: 220px;">
      <select value="{{ clientId }}" onChange="{{ onPickClient }}" aria-label="Switch client" title="Switch client" style="appearance: none; -webkit-appearance: none; border: 0; background: transparent; height: 100%; min-width: 0; flex: 1; padding: 0 44px 0 16px; font: 700 15px Manrope, sans-serif; color: #081A53; cursor: pointer; border-radius: 10px; text-overflow: ellipsis;">
        <sc-for list="{{ clients }}" as="c" hint-placeholder-count="2"><option value="{{ c.id }}">{{ c.name }}</option></sc-for>
      </select>
      <span aria-hidden="true" style="position: absolute; right: 0; top: 0; bottom: 0; width: 38px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(8,26,83,0.14); pointer-events: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#081A53" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
    </div>
  </div>
</div>
<!-- Saved Files mounts here (CosSavedBar, [data-cos-saved-mount]). -->
<div class="cos-subbar" data-cos-subbar="">
  <div class="cos-subbar-saved" data-cos-saved-mount=""></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"appName":{"editor":"text","default":"Content Offer Builder"},"agency":{"editor":"text","default":"McGuire Marketing"},"clientName":{"editor":"text","default":"Meridian Ridge Capital"},"clientId":{"editor":"text","default":"demo"},"email":{"editor":"text","default":"you@agency.com"},"backHref":{"editor":"text","default":"#"},"clients":{"editor":null},"onPickClient":{"editor":null},"onSignOut":{"editor":null},"$preview":{"width":1440,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      appName: p.appName || 'Content Offer Builder', agency: p.agency || '', hasAgency: !!p.agency, clientName: p.clientName || '', clientId: p.clientId || '', email: p.email || '', hasEmail: !!p.email,
      backHref: p.backHref || '#', clients: p.clients || [{ id: p.clientId || '', name: p.clientName || '' }],
      onPickClient: (e) => { if (p.onPickClient) p.onPickClient(e.target.value); },
      onSignOut: () => { if (p.onSignOut) p.onSignOut(); },
    };
  }
}
</script>

</html>
